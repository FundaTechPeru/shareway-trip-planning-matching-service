spring.application.name=shareway-trip-planning-matching-service
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:${SERVER_PORT:8081}}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/shareway_trip_planning}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shareway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shareway}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${SPRING_FLYWAY_SCHEMAS:shareway}
spring.flyway.default-schema=${SPRING_FLYWAY_DEFAULT_SCHEMA:shareway}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Authentication: HS256 access tokens issued by Driver Management, signed with the JWT_SECRET shared
# by the API Gateway and every service. Outside the dev, test and local profiles the service refuses
# to start without a JWT_SECRET of at least 32 characters (see JwtSecretValidator).
app.jwt.secret=${JWT_SECRET:}

# Calls between ShareWay services carry the X-Internal-Api-Key header. Outside the dev, test and
# local profiles the service refuses to start without INTERNAL_API_KEY (see InternalApiKeyValidator).
app.internal.api-key=${INTERNAL_API_KEY:}

# Booking & Pricing receives the trip group events. Free Render services can take up to a minute
# to wake up, hence the 90 s timeout.
app.booking.url=${BOOKING_URL:https://shareway-booking-pricing.onrender.com}
app.booking.timeout=90s

# Enable delivery once Booking advertises its internal event endpoint. Events are stored either way.
app.outbox.relay-enabled=${OUTBOX_RELAY_ENABLED:false}
app.outbox.poll-interval=5s
app.outbox.batch-size=50
app.outbox.initial-backoff=5s
app.outbox.max-backoff=5m

#---
spring.config.activate.on-profile=dev | local
# Development defaults, only for the dev and local profiles (--spring.profiles.active=dev).
# They are the shared ShareWay development values and must never be used in production.
app.jwt.secret=${JWT_SECRET:dev-only-shareway-driver-management-secret-change-me}
app.internal.api-key=${INTERNAL_API_KEY:dev-only-shareway-internal-api-key}
