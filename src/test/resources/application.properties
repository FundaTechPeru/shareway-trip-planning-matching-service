spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:trip_planning_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Shared ShareWay development values; tests sign their own tokens with this secret.
app.jwt.secret=dev-only-shareway-driver-management-secret-change-me
app.internal.api-key=dev-only-shareway-internal-api-key

# Nothing is sent to Booking from tests unless a test starts its own HTTP server.
app.booking.url=http://localhost:9
app.booking.timeout=2s
app.outbox.relay-enabled=false
