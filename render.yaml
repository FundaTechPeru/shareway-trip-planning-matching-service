services:
  - type: web
    name: shareway-trip-planning-matching-service
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: 5
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: 1
      - key: SPRING_FLYWAY_SCHEMAS
        sync: false
      - key: SPRING_FLYWAY_DEFAULT_SCHEMA
        sync: false
      # Same JWT_SECRET as the API Gateway and Driver Management (at least 32 characters).
      - key: JWT_SECRET
        sync: false
      # Key shared by the ShareWay services for internal calls (X-Internal-Api-Key).
      - key: INTERNAL_API_KEY
        sync: false
      # Booking & Pricing base URL; the service defaults to https://shareway-booking-pricing.onrender.com.
      - key: BOOKING_URL
        sync: false
      # Enable after Booking's internal event receiver is deployed.
      - key: OUTBOX_RELAY_ENABLED
        sync: false
